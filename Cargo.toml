[package]
name = "nostra"
description = "Nostra — a desktop chat client."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["yuewei"]
license = "Apache-2.0"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nostra"
path = "src/main.rs"

# All external dependencies resolve to git or crates.io — no filesystem paths.
# Cargo.lock pins the exact commits so every contributor gets the same build.
[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rust-embed = { version = "8.7", features = [
    "interpolate-folder-path",
    "include-exclude",
] }
# Same major/minor line as the gpui-component workspace so Cargo unifies on a
# single rust-i18n instance and `set_locale` affects both crates' `t!` lookups.
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["serde", "v7"] }
futures = "0.3"
async-io = "2"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
markdown = "1.0.0"
unicode-segmentation = "1.12"

# Zed/GPUI and gpui-component are maintained as one verified fork set. Checked-in
# dependencies pin exact commits: every GPUI crate shares one Zed revision and
# both component crates share one gpui-component revision.
gpui = { git = "https://github.com/yunxinx/zed.git", rev = "8d4c3af8efffdbaa3881f7d4fe50f44a662647d0" }
# `font-kit` and `runtime_shaders` only map to the macOS backend; they are
# no-ops elsewhere. `x11` / `wayland` are Linux backends and are enabled in
# the target-specific dependency below so they never reach macOS/Windows.
gpui_platform = { git = "https://github.com/yunxinx/zed.git", rev = "8d4c3af8efffdbaa3881f7d4fe50f44a662647d0", features = [
    "font-kit",
    "runtime_shaders",
] }
http_client = { git = "https://github.com/yunxinx/zed.git", rev = "8d4c3af8efffdbaa3881f7d4fe50f44a662647d0" }
reqwest_client = { git = "https://github.com/yunxinx/zed.git", rev = "8d4c3af8efffdbaa3881f7d4fe50f44a662647d0" }

# Bundled composer fonts remain reliable, cross-platform product defaults.
# Soft wrapping is now measured through production shaping, so correctness no
# longer depends on bundled font coverage; `examples/wrap_probe.rs` guards that
# contract with real bundled and system fonts.
#
# Match gpui-component's story crate: chat content can contain any fenced
# language, so the complete built-in grammar registry is required. The base
# `tree-sitter` feature only includes JSON and silently leaves common Rust,
# Python, JavaScript, and other fences unstyled.
# The pinned gpui-component revision owns Nostra's authoritative streaming
# TextView state, composable inline Markdown extensions, standard button/menu
# interaction contract, title-bar geometry, and nested horizontal scrolling.
gpui-component = { git = "https://github.com/yunxinx/gpui-component.git", rev = "c6bc13642c147956ed0d628f97d4e37f60b41511", features = [
    "tree-sitter-languages",
] }
gpui-component-assets = { git = "https://github.com/yunxinx/gpui-component.git", rev = "c6bc13642c147956ed0d628f97d4e37f60b41511" }

# Frozen RaTeX git rev for the formula path (parser, layout, SVG, and fonts),
# not crates.io 0.1.14. The `embed-fonts` feature makes formula images
# self-contained, so the desktop app does not need Node.js, WebView, CSS, or a
# system KaTeX font installation.
ratex-parser = { git = "https://github.com/erweixin/RaTeX.git", rev = "3657473fa2e7a9734b7b62822dad881a288fea23" }
ratex-layout = { git = "https://github.com/erweixin/RaTeX.git", rev = "3657473fa2e7a9734b7b62822dad881a288fea23" }
ratex-types = { git = "https://github.com/erweixin/RaTeX.git", rev = "3657473fa2e7a9734b7b62822dad881a288fea23" }
ratex-svg = { git = "https://github.com/erweixin/RaTeX.git", rev = "3657473fa2e7a9734b7b62822dad881a288fea23", features = [
    "embed-fonts",
] }

# Same git rev as the root `gpui_platform` pin; Cargo unifies the crate and
# merges these Linux-only features into that one copy.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/yunxinx/zed.git", rev = "8d4c3af8efffdbaa3881f7d4fe50f44a662647d0", features = [
    "x11",
    "wayland",
] }

[dev-dependencies]
gpui = { git = "https://github.com/yunxinx/zed.git", rev = "8d4c3af8efffdbaa3881f7d4fe50f44a662647d0", features = ["test-support"] }
gpui-base = { git = "https://github.com/yunxinx/gpui-component.git", rev = "c6bc13642c147956ed0d628f97d4e37f60b41511" }

# Build tweaks copied from the gpui-component workspace to keep dev builds
# usable; without these the dev binary is very slow.
[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
sum_tree = { opt-level = 3 }
ropey = { opt-level = 3 }
lsp-types = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }

# Cross-crate inlining on the GPUI render/layout hot path. Keep symbols; do
# not strip here — crash reports still need them.
[profile.release]
lto = "thin"
codegen-units = 1

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
