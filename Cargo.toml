[package]
name = "nostra"
description = "Nostra — a desktop chat client."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["yuewei"]
license = "Apache-2.0"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nostra"
path = "src/main.rs"

# All external dependencies resolve to git or crates.io — no filesystem paths.
# Cargo.lock pins the exact commits so every contributor gets the same build.
[dependencies]
anyhow = "1"
rust-embed = { version = "8.7", features = [
    "interpolate-folder-path",
    "include-exclude",
] }
# Same major/minor line as the gpui-component workspace so Cargo unifies on a
# single rust-i18n instance and `set_locale` affects both crates' `t!` lookups.
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
futures = "0.3"
async-io = "2"
url = "2"
markdown = "1.0.0"
unicode-segmentation = "1.12"

# Zed/GPUI and gpui-component are maintained as one verified fork set. Checked-in
# dependencies pin exact commits: every GPUI crate shares one Zed revision and
# both component crates share one gpui-component revision.
gpui = { git = "https://github.com/yunxinx/zed.git", rev = "364d53cf605181edeba234a69942c22863c81a2a" }
gpui_platform = { git = "https://github.com/yunxinx/zed.git", rev = "364d53cf605181edeba234a69942c22863c81a2a", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
http_client = { git = "https://github.com/yunxinx/zed.git", rev = "364d53cf605181edeba234a69942c22863c81a2a" }
reqwest_client = { git = "https://github.com/yunxinx/zed.git", rev = "364d53cf605181edeba234a69942c22863c81a2a" }

# Bundled composer fonts remain reliable, cross-platform product defaults.
# Soft wrapping is now measured through production shaping, so correctness no
# longer depends on bundled font coverage; `examples/wrap_probe.rs` guards that
# contract with real bundled and system fonts.
#
# Match gpui-component's story crate: chat content can contain any fenced
# language, so the complete built-in grammar registry is required. The base
# `tree-sitter` feature only includes JSON and silently leaves common Rust,
# Python, JavaScript, and other fences unstyled.
# The pinned gpui-component revision owns Nostra's authoritative streaming
# TextView state, composable inline Markdown extensions, standard button/menu
# interaction contract, title-bar geometry, and nested horizontal scrolling.
gpui-component = { git = "https://github.com/yunxinx/gpui-component.git", rev = "ce8305e0d206470cf9eb5efe339c0d470c91b387", features = [
    "tree-sitter-languages",
] }
gpui-component-assets = { git = "https://github.com/yunxinx/gpui-component.git", rev = "ce8305e0d206470cf9eb5efe339c0d470c91b387" }

# RaTeX publishes versioned crates on crates.io, so use a semver-compatible
# requirement here; Cargo.lock records the exact verified release. The
# `embed-fonts` feature makes formula images self-contained, so the desktop app
# does not need Node.js, WebView, CSS, or a system KaTeX font installation.
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-svg = { version = "0.1.14", features = [
    "embed-fonts",
] }

[dev-dependencies]
gpui = { git = "https://github.com/yunxinx/zed.git", rev = "364d53cf605181edeba234a69942c22863c81a2a", features = ["test-support"] }

# Build tweaks copied from the gpui-component workspace to keep dev builds
# usable; without these the dev binary is very slow.
[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
sum_tree = { opt-level = 3 }
ropey = { opt-level = 3 }
lsp-types = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }
