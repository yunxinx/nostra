    about:
      en: About
      zh-CN: 关于
  language:
    en: Interface language
    zh-CN: 界面语言
  language_desc:
    en: Language used across the app UI.
    zh-CN: 应用界面所使用的语言。
  detailed_logging:
    en: Detailed diagnostic logs
    zh-CN: 详细诊断日志
  detailed_logging_desc:
    en: By default Nostra records warnings and errors only. Enable this to also record sparse lifecycle information; prompts, API keys, and provider response bodies are never logged.
    zh-CN: Nostra 默认只记录警告和错误。开启后会额外记录少量生命周期信息；提示词、API 密钥和供应商响应正文永远不会写入日志。
  restore_last_chat:
    en: Restore last chat on start
    zh-CN: 启动时恢复上次聊天
  restore_last_chat_desc:
    en: Reopen the most recently active conversation when Nostra launches. The first catalog frame is never blocked; a missing or invalid session falls back to the empty workspace.
    zh-CN: 启动 Nostra 时重新打开最近活动的会话。首帧目录不会被阻塞；会话缺失或无效时回退到空工作区。
  theme_mode:
    en: Theme mode
    zh-CN: 主题模式
  theme_mode_desc:
    en: Follow the system appearance, or always use light / dark.
    zh-CN: 跟随系统外观，或固定使用浅色/深色。
  mode:
    system:
      en: System
      zh-CN: 跟随系统
    light:
      en: Light
      zh-CN: 浅色
    dark:
      en: Dark
      zh-CN: 深色
  light_theme:
    en: Light theme
    zh-CN: 浅色主题
  light_theme_desc:
    en: Theme used while in light mode.
    zh-CN: 浅色模式下使用的主题。
  dark_theme:
    en: Dark theme
    zh-CN: 深色主题
  dark_theme_desc:
    en: Theme used while in dark mode.
    zh-CN: 深色模式下使用的主题。
  composer_font:
    en: Composer font
    zh-CN: 输入框字体
  composer_font_desc:
    en: Bundled font used by the message input; both options keep soft-wrap positions exact.
    zh-CN: 消息输入框使用的内嵌字体；两种选择都能保证换行位置精确。
  user_message_markdown:
    en: User message Markdown
    zh-CN: 用户消息 Markdown
  user_message_markdown_desc:
    en: Interpret Markdown and math syntax in user messages; when off, show the original text.
    zh-CN: 渲染用户消息中的 Markdown 与数学语法；关闭时显示原始文本。
  smooth_chat_scrolling:
    en: Smooth conversation scrolling
    zh-CN: 对话区域平滑滚动
  smooth_chat_scrolling_desc:
    en: Ease discrete mouse-wheel scrolling in the conversation area; precise touchpad scrolling is unchanged.
    zh-CN: 让对话区域的离散鼠标滚轮滚动更平滑；触控板的精确滚动不受影响。
  code_wrap:
    en: Code block wrapping
    zh-CN: 代码块自动换行
  code_wrap_desc:
    en: Set wrapping for all code blocks; each block can still be changed separately afterward.
    zh-CN: 为所有代码块设置自动换行；之后仍可单独调整每个代码块。
  code_line_numbers:
    en: Code block line numbers
    zh-CN: 代码块行号
  code_line_numbers_desc:
    en: Show a line-number gutter in fenced code blocks.
    zh-CN: 在围栏代码块中显示行号栏。
  hide_info_buttons:
    en: Hide info buttons
    zh-CN: 隐藏提示按钮
  hide_info_buttons_desc:
    en: Hide the information buttons next to settings that show additional explanations.
    zh-CN: 隐藏设置项旁用于显示补充说明的提示按钮。
  glass_effect:
    en: Glass effect
    zh-CN: 毛玻璃效果
  glass_effect_desc:
    en: Use the native macOS blurred backdrop with a translucent theme tint.
    zh-CN: 使用 macOS 原生背景模糊，并叠加半透明主题色。
  glass_opacity:
    en: Glass opacity
    zh-CN: 毛玻璃不透明度
  glass_opacity_desc:
    en: Adjust the opacity of the theme tint above the native blurred backdrop.
    zh-CN: 调整原生模糊背景上方主题色遮罩的不透明度。
  providers:
    unnamed:
      en: "Unnamed provider %{index}"
      zh-CN: "未命名供应商 %{index}"
    add_profile:
      en: Add provider
      zh-CN: 添加供应商
    more_actions:
      en: More actions
      zh-CN: 更多操作
    delete_profile:
      en: Delete this provider
      zh-CN: 删除此供应商
    delete_profile_title:
      en: Delete this provider?
      zh-CN: 删除此供应商？
    delete_profile_confirm:
      en: Delete
      zh-CN: 删除
    delete_profile_cancel:
      en: Cancel
      zh-CN: 取消
    empty:
      en: Add a provider to start configuring models.
      zh-CN: 添加供应商以开始配置模型。
    name:
      en: Provider name
      zh-CN: 供应商名称
    name_desc:
      en: Display name for this provider, used in the list here and in the model picker. Required — a provider without a name cannot be used.
      zh-CN: 此供应商的显示名称，用于左侧列表和模型选择菜单。必填，未命名的供应商无法使用。
    name_placeholder:
      en: e.g. OpenAI
      zh-CN: 例如 OpenAI
    base_url:
      en: API Base URL
      zh-CN: API Base URL
    base_url_desc:
      en: "Root address of the OpenAI-compatible API, e.g. https://api.openai.com/v1. The endpoint path is appended automatically, so do not include /chat/completions or /responses, nor a query string."
      zh-CN: "OpenAI 兼容 API 的根地址，例如 https://api.openai.com/v1。接口路径会自动追加，因此不要填写 /chat/completions 或 /responses，也不要带查询参数。"
    wire_api:
      en: Wire API
      zh-CN: 接口协议
    wire_api_desc:
      en: "Request format used against this provider, which also decides the endpoint path: Chat Completions (/chat/completions) is the widest supported; Responses (/responses) is OpenAI's newer API and can carry reasoning state across turns."
      zh-CN: "向该供应商发起请求所用的格式，同时决定追加的接口路径：Chat Completions（/chat/completions）兼容性最广；Responses（/responses）是 OpenAI 的较新接口，可跨轮携带推理状态。"
    api_key:
      en: API Key
      zh-CN: API Key
    api_key_desc:
      en: Sent as an Authorization Bearer header on every request. Stored as plain text in this machine's preferences file, so treat that file as a secret.
      zh-CN: 每次请求都会以 Authorization Bearer 请求头发送。它以明文保存在本机的配置文件中，请将该文件视为敏感信息。
    show_api_key:
      en: Show API Key
      zh-CN: 显示 API Key
    hide_api_key:
      en: Hide API Key
      zh-CN: 隐藏 API Key
    compatibility:
      en: Compatibility
      zh-CN: 兼容选项
    compatibility_desc:
      en: Wire-format tweaks for gateways and third-party services that only partly follow the OpenAI spec. The defaults suit most providers — reach for these when a request is rejected or reasoning output fails to show up.
      zh-CN: 针对网关和第三方服务只部分遵循 OpenAI 规范的传输格式微调。默认值适用于大多数供应商，只在请求被拒绝或推理内容无法显示时才需要调整。
    max_tokens_field:
      en: Token limit field
      zh-CN: Token 上限字段
    max_tokens_field_desc:
      en: Field name carrying the output token cap. max_completion_tokens is the current OpenAI spelling; switch to max_tokens for older gateways that reject the newer name.
      zh-CN: 用于传递输出 token 上限的字段名。max_completion_tokens 是 OpenAI 当前的写法；若网关较旧、不接受新字段名，则改用 max_tokens。
    system_role:
      en: System instruction role
      zh-CN: 系统指令角色
    system_role_desc:
      en: Role name used when sending system instructions. Preserve keeps whatever the message already carries; pick system or developer to force every system instruction onto one role that this provider accepts.
      zh-CN: 发送系统指令时所用的角色名。保持原样即沿用消息自带的角色；选择 system 或 developer 可将所有系统指令统一改写为该供应商接受的角色。
    reasoning_field:
      en: Reasoning field
      zh-CN: 推理字段
    reasoning_field_desc:
      en: Field the reasoning text is read from in a streamed Chat Completions response. Auto tries reasoning_content, reasoning, then reasoning_text; name one explicitly if the provider fills several and the wrong one is picked.
      zh-CN: 从 Chat Completions 流式响应中读取推理内容的字段。自动会依次尝试 reasoning_content、reasoning、reasoning_text；若供应商同时返回多个而选错，可指定其中一个。
    responses_instructions:
      en: Responses instructions
      zh-CN: Responses 指令位置
    responses_instructions_desc:
      en: Where system instructions go in a Responses request. Top level merges them into the instructions field; input items leaves them as ordinary messages, which some compatible implementations require. Ignored by Chat Completions.
      zh-CN: Responses 请求中系统指令的放置位置。顶层字段会合并到 instructions；输入项则保留为普通消息，部分兼容实现要求这样。Chat Completions 不受此项影响。
    option:
      preserve:
        en: Preserve
        zh-CN: 保持原样
      auto:
        en: Auto
        zh-CN: 自动
      top_level:
        en: Top level
        zh-CN: 顶层字段
      input_items:
        en: Input items
        zh-CN: 输入项
    stream_usage:
      en: Request stream usage
      zh-CN: 请求流式用量
    stream_usage_desc:
      en: Asks a streamed Chat Completions request to report token usage via stream_options.include_usage. Turn it off for providers that reject the parameter; usage figures are then unavailable.
      zh-CN: 在 Chat Completions 流式请求中通过 stream_options.include_usage 索取 token 用量。若供应商不接受该参数，可关闭，代价是拿不到用量数据。
    nullable_tool_fields:
      en: Accept nullable tool fields
      zh-CN: 接受可空工具字段
    nullable_tool_fields_desc:
      en: Tolerates null id, name, or arguments in a streamed tool call instead of failing the response. Keep it on unless you want strict protocol checking.
      zh-CN: 容忍流式工具调用中 id、name 或 arguments 为 null，而不是直接判定响应失败。除非需要严格校验协议，建议保持开启。
    object_tool_arguments:
      en: Accept object tool arguments
      zh-CN: 接受对象形式工具参数
    object_tool_arguments_desc:
      en: Accepts tool arguments sent as a JSON object and re-serializes them, rather than requiring the JSON string the spec calls for. Needed by providers that skip the stringify step.
      zh-CN: 接受以 JSON 对象形式发来的工具参数并重新序列化，而不强制要求规范规定的 JSON 字符串。部分供应商省略了字符串化，需要此项。
    models:
      en: Models
      zh-CN: 模型
    models_desc:
      en: Models exposed by this provider. Each row takes the unique upstream model ID sent in requests (left) and an optional unique display alias (right). At least one model with an ID is required before the provider can be selected in a chat.
      zh-CN: 该供应商可用的模型。每行左侧填请求中实际发送且不可重复的上游模型 ID，右侧填可选且不可重复的显示别名。至少需要一个填好 ID 的模型，供应商才能在聊天中被选用。
    add_model:
      en: Add model
      zh-CN: 添加模型
    delete_model:
      en: Delete model
      zh-CN: 删除模型
    model_name_placeholder:
      en: Display name (optional)
      zh-CN: 显示别名（可选）
    model_id_placeholder:
      en: Model ID
      zh-CN: 模型 ID
    duplicate_model_id:
      en: Model IDs must be unique within a provider. The previous value was restored.
      zh-CN: 同一供应商内的模型 ID 不可重复，已恢复为修改前的值。
    duplicate_model_name:
      en: Display aliases must be unique within a provider. The previous value was restored.
      zh-CN: 同一供应商内的显示别名不可重复，已恢复为修改前的值。
  about:
    version:
      en: Version
      zh-CN: 版本
    description:
      en: A desktop chat client built with GPUI.
      zh-CN: 基于 GPUI 构建的桌面聊天客户端。
    license:
      en: Released under the Apache License 2.0.
      zh-CN: 基于 Apache License 2.0 许可发布。
